name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  ci:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Coverage gate (>= 70% on server/src/spotify and server/src/routes)
        run: npm run test:coverage
      - run: npm run build
      - name: No secrets in the client bundle
        run: npm run check:secrets

  image:
    name: Build & push image (GHCR)
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to droplet
    needs: image
    runs-on: ubuntu-24.04
    # Use a GitHub environment so secrets can be scoped and approvals added if wanted.
    environment:
      name: production
      url: https://${{ vars.PULSE_DOMAIN || 'music.gallardoapps.com' }}
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image.outputs.image }}:sha-${{ github.sha }}
      DOMAIN: ${{ vars.PULSE_DOMAIN || 'music.gallardoapps.com' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/pulse' }}
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key (no trust-on-first-use).
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SSH_OPTS=-i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Sync compose file and Caddyfile
        run: |
          # SSH_OPTS is intentionally word-split.
          ssh $SSH_OPTS "$TARGET" "mkdir -p '$DEPLOY_PATH/docker'"
          scp $SSH_OPTS docker-compose.yml "$TARGET:$DEPLOY_PATH/docker-compose.yml"
          scp $SSH_OPTS docker/Caddyfile "$TARGET:$DEPLOY_PATH/docker/Caddyfile"

      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The short-lived workflow token goes over stdin, never on a command line or to disk on the server.
          printf '%s' "$GHCR_TOKEN" | ssh $SSH_OPTS "$TARGET" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin >/dev/null"
          ssh $SSH_OPTS "$TARGET" bash -se <<EOF_REMOTE
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          cd '$DEPLOY_PATH'
          test -f .env || { echo '::error::$DEPLOY_PATH/.env is missing on the server'; exit 1; }
          export PULSE_IMAGE='$IMAGE'
          docker compose pull app
          docker compose up -d --remove-orphans
          docker image prune -f >/dev/null
          docker compose ps
          EOF_REMOTE

      - name: Health check
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "https://$DOMAIN/api/health" | tee /dev/stderr | grep -q '"ok":true'
